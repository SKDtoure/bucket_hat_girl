<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilt Parallax</title>
<style>
  html, body { height: 100%; margin: 0; background: #151515; overflow: hidden; }
  body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .stage {
    --ar: 1;
    position: relative;
    width: min(100vw, calc(100dvh * var(--ar)));
    aspect-ratio: var(--ar);
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  .layer {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 100%;
    object-fit: fill;
    will-change: transform;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .ui {
    position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  button#enable {
    pointer-events: auto;
    font-weight: 600; font-size: 15px; line-height: 1; font-family: inherit;
    padding: 12px 20px; border-radius: 999px; border: 0;
    background: #f2f2f2; color: #151515; cursor: pointer;
  }
  button#enable:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 3px; }
  .hint {
    font-size: 13px; color: #fff; background: rgba(0,0,0,.55);
    padding: 6px 12px; border-radius: 999px;
    transition: opacity .6s ease;
  }
  .hidden { display: none !important; }
  .fade { opacity: 0; }
</style>
</head>
<body>

<main class="stage" id="stage" aria-label="Animated portrait that shifts as you tilt your phone or move your mouse. Tap for music and a sparkle flash. Hold to reverse the balloons.">
  <div class="ui">
    <button id="enable" class="hidden" type="button">Tap to enable tilt</button>
    <div id="hint" class="hint hidden"></div>
  </div>
</main>

<script>
/* ======================= EDIT THESE ======================= */

/*
  LAYERS: list from BACK to FRONT (the order of lines = stacking order).

  id          a short name the animation script uses
  depth       0 = barely moves, 1+ = moves the most
  controlled  true = the script sets this layer's opacity (fades, flashes, frame swaps)
  rest        opacity of a controlled layer if motion is turned off (default 0)
  rotate / idleRotate / breathe / origin   optional

  Every layer that belongs to the portrait shares PORTRAIT settings so they all
  move and breathe together and never drift apart. The two outlines use PORTRAIT
  too, with a slightly different depth, so they float a little apart from her when you tilt.
*/
const PORTRAIT = { depth: 0.60, breathe: 0.006, origin: "50% 90%" };

const LAYERS = [
  { id: "bg1", src: "layer1-bucketgrl-prt-background1.png", depth: 0.12 },
  { id: "bg2", src: "layer1-bucketgrl-prt-background2.png", depth: 0.18, controlled: true, rest: 0.7 },   // sparkles and clouds

  // Birds: one image that the script spins around BIRD_ORIGIN (see BIRDS below)
  { id: "bird", src: "layer2-bucketgrl-prt-bird01.png", depth: 0.28, origin: "50% 50%", bird: true },

  // Balloons: one image each; the script drifts them up (or down) the frame (see BALLOONS below)
  { id: "balloonA", src: "layer3-bucketgrl-prt-balloonA01.png", depth: 0.32, balloon: true },
  { id: "balloonB", src: "layer3-bucketgrl-prt-balloonB01.png", depth: 0.38, balloon: true },

  { id: "outline1", src: "layer4-bucketgrl-prt-outline1.png", ...PORTRAIT, depth: 0.52, controlled: true, rest: 0.6 },

  { id: "base0",  src: "layer5-bucketgrl-prt-base0.png", ...PORTRAIT },
  { id: "base1",  src: "layer5-bucketgrl-prt-base1.png", ...PORTRAIT, controlled: true },

  // Eyes: shifted looks sit below the blink frames so eyelids always cover them
  { id: "shift_left",  src: "layer6-bucketgrl-prt-shift_left.png",  ...PORTRAIT, controlled: true },
  { id: "shift_right", src: "layer6-bucketgrl-prt-shift_right.png", ...PORTRAIT, controlled: true },
  { id: "shift_up",    src: "layer6-bucketgrl-prt-shift_up.png",    ...PORTRAIT, controlled: true },
  { id: "shift_down",  src: "layer6-bucketgrl-prt-shift_down.png",  ...PORTRAIT, controlled: true },
  { id: "blink01", src: "layer6-bucketgrl-prt-blink01.png", ...PORTRAIT, controlled: true },   // half blink
  { id: "blink02", src: "layer6-bucketgrl-prt-blink02.png", ...PORTRAIT, controlled: true },   // closed

  { id: "outline2", src: "layer7-bucketgrl-prt-outline2.png", ...PORTRAIT, depth: 0.66, controlled: true, rest: 0 }
];

// ---- Movement feel ----
const MAX_SHIFT = 0.03;      // front-layer travel as a fraction of image width
const TILT_RANGE = 20;       // degrees of phone tilt for full movement
const SMOOTHING = 0.08;      // 0.04 = floaty, 0.15 = snappy
const DIRECTION = 1;         // set to -1 if the movement feels backwards
const BREATH_PERIOD = 4.2;   // seconds per breath
const IDLE_PERIOD = 7;       // seconds per idle sway cycle

// ---- Birds: one image spun in a complete circle ----
const BIRD_ORIGIN = "50% 50%";  // the centre they circle around, as "x% y%" of the whole canvas (EDIT THIS to the middle of the ring)
const BIRD_PERIOD = 24;         // seconds for one full circle
const BIRD_DIR = 1;             // 1 = clockwise, -1 = anticlockwise

// ---- Balloons: drift from the bottom to the top of the frame, then loop ----
//   travel      seconds to cross the whole frame (bigger = slower)
//   hoverGap    random wait (min, max seconds) between hovers
//   hoverTime   random length (min, max seconds) of each hover
//   startAt     where it begins on its first pass (0 = bottom, 1 = top), so the two balloons aren't in step
//   sway / swayPeriod   gentle side-to-side drift (fraction of image width) and its speed
//   swayTilt    degrees of rock that goes with the sway
const BALLOONS = [
  { id: "balloonA", travel: 16, hoverGap: [5, 11], hoverTime: [1.6, 3.6], startAt: 0.15, sway: 0.010, swayPeriod: 5.2, swayTilt: 2.5 },
  { id: "balloonB", travel: 21, hoverGap: [6, 13], hoverTime: [1.8, 4.0], startAt: 0.60, sway: 0.014, swayPeriod: 6.4, swayTilt: 3.0 }
];
const BALLOON_EASE = 2.2;         // how softly a balloon slows into / out of a hover (higher = quicker)
const BALLOON_MARGIN = 0.04;      // extra distance past the edges so a balloon is fully out of sight before it loops
const BALLOON_TILT_SLOW = 0;      // 0 = tilting doesn't affect them; 0.5 = they slow to half speed at full tilt
const REVERSE_EASE = 3;           // how smoothly a balloon turns around when you long-press (higher = quicker)
const LONG_PRESS_TIME = 0.5;      // seconds to hold before it counts as a long press
const LONG_PRESS_MODE = "toggle"; // "toggle" = each long press flips the direction (up <-> down); "hold" = balloons fall only while you hold

// ---- Music: first tap plays, second tap pauses, double-tap resets ----
const AUDIO = { src: "Hej Motti - Umino.mp3", start: 0, length: 45, fade: 1.2, fadeIn: 0.8 };   // plays 45 seconds, then loops
const AUDIO_LOOP = true;            // true = the 45 seconds repeat until you pause
const AUDIO_VOLUME = 1;             // 0 to 1
const DOUBLE_TAP_RESTARTS = false;  // false = double-tap rewinds and stays paused; true = rewinds and plays again
const DOUBLE_TAP_RECENTERS = true;  // double-tap also re-centers the tilt (the old behaviour)
const TAP_MAX_MOVE = 14;            // pixels a finger/mouse may move and still count as a tap
const DOUBLE_TAP_TIME = 0.35;       // seconds between two taps to count as a double-tap

// ---- Sparkle background (background2): twinkles, flashes on tap ----
const SPARKLE_MIN = 0.35;    // dimmest idle sparkle (0 to 1)
const SPARKLE_MAX = 0.90;    // brightest idle sparkle

// ---- outline1: slow glow pulse; flashes on tap ----
const OUTLINES = [
  { id: "outline1", period: 5.0, phase: 0.0, min: 0.30, max: 0.85 }
];

// ---- outline2: invisible when idle, fades in while you tilt, flashes on tap ----
const OUTLINE2_MAX = 0.80;     // how visible it gets at full tilt (0 to 1)
const OUTLINE2_SMOOTH = 0.06;  // fade speed: lower = slower, softer

// ---- Tap flash (sparkles + outlines) ----
const PULSE_RISE = 0.08;     // seconds to reach full brightness
const PULSE_DECAY = 3.2;     // higher = flash dies faster

// ---- Blinking ----
const BLINK = [[0.05, "blink01"], [0.09, "blink02"], [0.06, "blink01"]];
const BLINK_GAP = [2.5, 6];  // random wait between blinks (min, max seconds)

// ---- Eyes: follow the tilt in four directions, and glance around when you're still ----
const SHIFT_THRESHOLD = 0.35;   // how far to tilt (0 to 1) before the eyes shift
const SHIFT_SMOOTH = 0.25;      // 0.1 = slow fade, 0.5 = near instant
const SWAP_HORIZONTAL = false;  // set to true if left and right look backwards
const SWAP_VERTICAL = false;    // set to true if up and down look backwards
const GLANCE_AFTER = 2.0;       // seconds of stillness before she starts glancing
const GLANCE_GAP = [3, 7];      // random wait between glances
const GLANCE_HOLD = [0.7, 1.4]; // how long each glance lasts

// ---- base1: fades in while you tilt, back to base0 when idle ----
const BASE1_TILT_GAIN = 1.6;   // how quickly it reaches full strength as you tilt
const BASE1_IDLE_AFTER = 1.2;  // seconds of stillness before it fades back out
const BASE1_MOVE_EPS = 0.004;  // how small a movement still counts as "still"
const BASE1_SMOOTH = 0.05;     // fade speed: lower = slower, softer

/* ======================= CODE ======================= */

const stage = document.getElementById("stage");
const enableBtn = document.getElementById("enable");
const hint = document.getElementById("hint");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = ([a, b]) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const EYE_DIRS = ["left", "right", "up", "down"];

// Build the layers
const layers = LAYERS.map((cfg, i) => {
  const img = new Image();
  img.className = "layer";
  img.alt = "";
  img.draggable = false;
  img.src = cfg.src;
  img.style.transformOrigin = cfg.origin || "50% 50%";
  const rest = cfg.rest != null ? cfg.rest : 0;
  const controlled = !!cfg.controlled;
  // With this many frames, layers that aren't showing are switched off completely
  // (not just made transparent), so the phone isn't juggling ~100 layers at once.
  const hidden = controlled && rest <= 0.001;
  if (controlled) img.style.opacity = rest;
  if (hidden) img.style.display = "none";
  if (cfg.balloon) img.style.display = "none";            // shown once its size has been measured
  if (cfg.bird) img.style.transformOrigin = BIRD_ORIGIN;
  stage.insertBefore(img, stage.querySelector(".ui"));
  return {
    id: cfg.id,
    el: img,
    depth: cfg.depth,
    rotate: cfg.rotate || 0,
    idleRotate: cfg.idleRotate || 0,
    breathe: cfg.breathe || 0,
    bird: !!cfg.bird,
    balloon: !!cfg.balloon,
    controlled: controlled,
    rest: rest,
    hidden: hidden,
    phase: i * 1.7,
    shift: 0,
    lastOp: -1
  };
});

// Match stage to the first layer's aspect ratio
function setAspect() {
  const first = layers[0].el;
  if (first.naturalWidth) stage.style.setProperty("--ar", first.naturalWidth / first.naturalHeight);
  sizeLayers();
}
layers[0].el.addEventListener("load", setAspect);
if (layers[0].el.complete) setAspect();

// Each layer is enlarged by the distance it can travel, so edges never show.
function sizeLayers() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  layers.forEach(l => {
    l.shift = l.depth * MAX_SHIFT * w;
    const pad = l.shift;
    l.el.style.left = -pad + "px";
    l.el.style.top = -pad + "px";
    l.el.style.width = (w + pad * 2) + "px";
    l.el.style.height = (h + pad * 2) + "px";
  });
}
new ResizeObserver(sizeLayers).observe(stage);

/* ---------- Balloons: measure each one, then drift it up the frame ---------- */

// Downscale an image and find the box around its visible pixels
function scanBox(img) {
  const w = 300, h = Math.max(1, Math.round(w * img.naturalHeight / img.naturalWidth));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, x1 = -1, y0 = h, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 20) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  return x1 < 0 ? null : { x0: x0 / w, x1: (x1 + 1) / w, y0: y0 / h, y1: (y1 + 1) / h };
}

const balloons = BALLOONS.map((cfg, i) => {
  const layer = layers.find(l => l.id === cfg.id);
  if (!layer) return null;
  const b = {
    ...cfg, l: layer, ready: false,
    y0: 0, y1: 1, cy: 0.5,              // box around the balloon, as fractions of the image height (measured below)
    p: cfg.startAt, speed: 1, hover: false, hoverUntil: 0,
    nextHover: 3 + Math.random() * 4, phase: i * 2.3
  };
  const setup = () => {
    let box = null;
    try { box = scanBox(layer.el); }
    catch (e) { console.info("Couldn't measure " + cfg.id + " (normal when opened from disk); using the full frame height."); }
    if (box) {
      b.y0 = box.y0; b.y1 = box.y1;
      layer.el.style.transformOrigin = (((box.x0 + box.x1) / 2) * 100) + "% " + (((box.y0 + box.y1) / 2) * 100) + "%";
    }
    b.cy = (b.y0 + b.y1) / 2;
    b.ready = true;
    layer.el.style.display = "block";
  };
  if (layer.el.complete && layer.el.naturalWidth) setup(); else layer.el.addEventListener("load", setup, { once: true });
  return b;
}).filter(Boolean);

let dirTarget = 1;      // 1 = balloons drift up, -1 = drift down
let dirNow = 1;         // eases toward dirTarget so they turn around smoothly

// Vertical position (in image heights) of a balloon at progress p: p = 0 just below the frame, p = 1 just above it
function balloonOffset(b) {
  const start = 1 - b.y0 + BALLOON_MARGIN;
  const travel = (1 - b.y0) + b.y1 + 2 * BALLOON_MARGIN;
  return start - b.p * travel;
}

function updateBalloons(t, dt) {
  dirNow += (dirTarget - dirNow) * (1 - Math.exp(-dt * REVERSE_EASE));
  const tiltSlow = 1 - BALLOON_TILT_SLOW * clamp(Math.hypot(cx, cy), 0, 1);
  for (const b of balloons) {
    if (!b.ready) continue;

    // at random moments a visible balloon stops and hovers, then drifts on
    if (!b.hover && t >= b.nextHover) {
      const y = b.cy + balloonOffset(b);            // balloon centre, 0 = top of frame, 1 = bottom
      if (y > 0.15 && y < 0.85) { b.hover = true; b.hoverUntil = t + rand(b.hoverTime); }
      else b.nextHover = t + 0.4;
    }
    if (b.hover && t >= b.hoverUntil) { b.hover = false; b.nextHover = t + rand(b.hoverGap); }

    b.speed += ((b.hover ? 0 : 1) - b.speed) * (1 - Math.exp(-dt * BALLOON_EASE));
    b.p += dirNow * b.speed * tiltSlow * dt / b.travel;
    if (b.p > 1) b.p -= 1;                          // out of the top: back in at the bottom
    else if (b.p < 0) b.p += 1;                     // out of the bottom (reversed): back in at the top
  }
}

/* ---------- Movement state ---------- */

let tx = 0, ty = 0, cx = 0, cy = 0;

/* ---------- Scene ---------- */

let op = {};
let pulseStart = -99;     // time of the last tap (seconds)
let base1 = 0;            // current base1 amount, 0 to 1
let outline2Amt = 0;      // current outline2 tilt amount, 0 to 1
let lastMove = 0;         // last time the tilt or mouse moved
let prevTx = 0, prevTy = 0;

let nextBlink = 2.5, blinkStart = -1;
let nextGlance = 4, glanceStart = -1, glanceDir = "left", glanceDur = 1;
const eyeAmt = { left: 0, right: 0, up: 0, down: 0 };

const total = steps => steps.reduce((s, st) => s + st[0], 0);

function pick(u, steps) {
  if (u < 0) return null;
  let acc = 0;
  for (const [dur, id] of steps) {
    acc += dur;
    if (u < acc) return id;
  }
  return null;
}

function runScene(t) {
  op = {};

  // Tap flash envelope (0 to 1)
  const k = t - pulseStart;
  let p = 0;
  if (k >= 0) p = k < PULSE_RISE ? k / PULSE_RISE : Math.exp(-(k - PULSE_RISE) * PULSE_DECAY);

  // Sparkle background: irregular twinkle plus tap flash
  const wobble = 0.6 * Math.sin(t * 1.1) + 0.4 * Math.sin(t * 2.7 + 0.9);
  const sparkle = SPARKLE_MIN + (SPARKLE_MAX - SPARKLE_MIN) * (0.5 + 0.5 * wobble);
  op.bg2 = sparkle + (1 - sparkle) * p;

  // outline1: slow eased pulse plus tap flash
  for (const o of OUTLINES) {
    const e = (1 - Math.cos(t * TAU / o.period + o.phase)) / 2;
    const eased = e * e * (3 - 2 * e);
    const v = o.min + (o.max - o.min) * eased;
    op[o.id] = v + (1 - v) * p;
  }

  // Track whether the viewer is moving
  const moved = Math.abs(tx - prevTx) + Math.abs(ty - prevTy);
  prevTx = tx; prevTy = ty;
  if (moved > BASE1_MOVE_EPS) lastMove = t;
  const since = t - lastMove;

  // base1: strength follows tilt, falls back to 0 when still
  const target = since > BASE1_IDLE_AFTER ? 0 : clamp(Math.hypot(cx, cy) * BASE1_TILT_GAIN, 0, 1);
  base1 += (target - base1) * BASE1_SMOOTH;
  op.base1 = base1;

  // outline2: follows the same tilt amount, but is fully invisible when idle; tap still flashes it
  outline2Amt += (target - outline2Amt) * OUTLINE2_SMOOTH;
  const o2 = outline2Amt * OUTLINE2_MAX;
  op.outline2 = o2 + (1 - o2) * p;

  // Random blinking
  if (blinkStart < 0 && t >= nextBlink) blinkStart = t;
  if (blinkStart >= 0) {
    const u = t - blinkStart;
    const f = pick(u, BLINK);
    if (f) op[f] = 1;
    if (u > total(BLINK)) {
      blinkStart = -1;
      nextBlink = t + rand(BLINK_GAP);
    }
  }

  // Eyes: follow the tilt (whichever direction is strongest); glance around on their own when still
  let want = null;
  const ax = Math.abs(cx), ay = Math.abs(cy);
  if (Math.max(ax, ay) > SHIFT_THRESHOLD) {
    if (ax >= ay) {
      want = (cx < 0) ? "left" : "right";
      if (SWAP_HORIZONTAL) want = (want === "left") ? "right" : "left";
    } else {
      want = (cy < 0) ? "up" : "down";
      if (SWAP_VERTICAL) want = (want === "up") ? "down" : "up";
    }
  }

  if (want) {
    glanceStart = -1;
  } else if (since > GLANCE_AFTER) {
    if (glanceStart < 0 && t >= nextGlance) {
      glanceStart = t;
      glanceDir = EYE_DIRS[Math.floor(Math.random() * EYE_DIRS.length)];
      glanceDur = rand(GLANCE_HOLD);
    }
    if (glanceStart >= 0) {
      if (t - glanceStart < glanceDur) {
        want = glanceDir;
      } else {
        glanceStart = -1;
        nextGlance = t + rand(GLANCE_GAP);
      }
    }
  } else {
    glanceStart = -1;
  }
  for (const d of EYE_DIRS) {
    eyeAmt[d] += ((want === d ? 1 : 0) - eyeAmt[d]) * SHIFT_SMOOTH;
    op["shift_" + d] = eyeAmt[d];
  }
}

let lastT = null;

function frame(now) {
  const t = now / 1000;
  const dt = lastT == null ? 0 : Math.min(t - lastT, 0.05);
  lastT = t;
  const W = stage.clientWidth, H = stage.clientHeight;
  cx += (tx - cx) * SMOOTHING;
  cy += (ty - cy) * SMOOTHING;

  runScene(t);
  updateBalloons(t, dt);

  for (const l of layers) {
    if (l.controlled) {
      const v = (l.id in op) ? op[l.id] : l.rest;
      if (v <= 0.001) {                                  // not showing: switch it off and skip the rest
        if (!l.hidden) { l.el.style.display = "none"; l.hidden = true; l.lastOp = 0; }
        continue;
      }
      if (l.hidden) { l.el.style.display = "block"; l.hidden = false; }
      if (v !== l.lastOp) { l.el.style.opacity = v; l.lastOp = v; }
    }

    let dx = -cx * l.shift * DIRECTION;
    let dy = -cy * l.shift * DIRECTION;

    let rot =
      cx * l.rotate * DIRECTION +
      Math.sin(t * TAU / IDLE_PERIOD + l.phase) * l.idleRotate;

    // birds: one image spun around BIRD_ORIGIN, a full circle every BIRD_PERIOD seconds
    if (l.bird) rot += ((t / BIRD_PERIOD) % 1) * 360 * BIRD_DIR;

    // balloons: drift up (or down) the frame, hover now and then, sway gently
    if (l.balloon) {
      const b = balloons.find(x => x.l === l);
      if (!b || !b.ready) continue;
      const layerH = H + 2 * l.shift;
      const hoverAmt = 1 - b.speed;                                   // 1 while fully hovering
      const bob = hoverAmt * Math.sin(t * TAU / 2.6 + b.phase) * 0.006 * layerH;
      dy += balloonOffset(b) * layerH + bob;
      const sw = Math.sin(t * TAU / b.swayPeriod + b.phase);
      dx += sw * b.sway * W;
      rot += sw * b.swayTilt;
    }

    let sx = 1, sy = 1;
    if (l.breathe) {
      const s = Math.sin(t * TAU / BREATH_PERIOD);
      sy = 1 + l.breathe * s;
      sx = 1 + l.breathe * 0.35 * s;
    }

    l.el.style.transform =
      "translate3d(" + dx + "px," + dy + "px,0) rotate(" + rot + "deg) scale(" + sx + "," + sy + ")";
  }
  requestAnimationFrame(frame);
}
if (!reduceMotion) requestAnimationFrame(frame);

/* ---------- Input: mouse, tilt, taps ---------- */

stage.addEventListener("pointermove", e => {
  if (e.pointerType === "touch" || reduceMotion) return;
  const r = stage.getBoundingClientRect();
  tx = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1);
  ty = clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1, 1);
});
stage.addEventListener("pointerleave", e => {
  if (e.pointerType !== "touch") { tx = 0; ty = 0; }
});

let base = null;
let gotSensor = false;

function onOrientation(e) {
  if (e.gamma == null || e.beta == null || reduceMotion) return;
  gotSensor = true;
  if (!base) base = { g: e.gamma, b: e.beta };
  tx = clamp((e.gamma - base.g) / TILT_RANGE, -1, 1);
  ty = clamp((e.beta - base.b) / TILT_RANGE, -1, 1);
}

function showHint(text, ms) {
  hint.textContent = text;
  hint.classList.remove("hidden", "fade");
  clearTimeout(showHint.t);
  showHint.t = setTimeout(() => {
    hint.classList.add("fade");
    setTimeout(() => hint.classList.add("hidden"), 700);
  }, ms);
}

function startTilt() {
  window.addEventListener("deviceorientation", onOrientation);
  enableBtn.classList.add("hidden");
  showHint("Tilt your phone. Tap for music, double-tap to reset it. Hold to reverse the balloons.", 6000);
  setTimeout(() => {
    if (!gotSensor) showHint("No motion sensor found. Move your mouse over the image.", 4000);
  }, 1500);
}

/* ---------- Music ---------- */

const audio = new Audio();
audio.preload = "metadata";
audio.volume = AUDIO_VOLUME;
audio.src = encodeURI(AUDIO.src);
const clipStart = AUDIO.start || 0;
const clipEnd = AUDIO.length > 0 ? clipStart + AUDIO.length : Infinity;
let audioFailed = false;

audio.addEventListener("error", () => {
  audioFailed = true;
  showHint("Couldn't load \"" + AUDIO.src + "\". Check the file is in the same folder as this page and the name matches.", 6000);
});
audio.addEventListener("loadedmetadata", () => rewind());      // jump to the clip's start once the file is ready

function rewind() {
  try { audio.currentTime = clipStart; } catch (e) {}
  audio.volume = AUDIO.fadeIn > 0 ? 0 : AUDIO_VOLUME;           // fades up from silence (not possible on iPhones)
}

// The clip ends at start + length even though the file is longer: fade out, loop (or stop), fade back in
setInterval(() => {
  if (audio.paused) return;
  const t = audio.currentTime;
  if (t >= clipEnd) {
    if (AUDIO_LOOP) rewind();
    else { audio.pause(); rewind(); showHint("\u21BA Done. Tap to play again", 1500); }
    return;
  }
  let v = 1;
  if (AUDIO.fadeIn > 0) v = Math.min(v, Math.max(0, (t - clipStart) / AUDIO.fadeIn));
  if (AUDIO.fade > 0) v = Math.min(v, Math.max(0, (clipEnd - t) / AUDIO.fade));
  audio.volume = clamp(AUDIO_VOLUME * v, 0, 1);
}, 50);

audio.addEventListener("ended", () => {                        // only reached if the file is shorter than the clip
  rewind();
  if (AUDIO_LOOP) audio.play().catch(() => {});
});

function togglePlay() {
  if (audio.paused) {
    if (audio.currentTime < clipStart || audio.currentTime >= clipEnd) rewind();   // always begin inside the clip
    const p = audio.play();
    if (p && p.catch) p.catch(() => { if (!audioFailed) showHint("Couldn't play the music on this device.", 3500); });
    showHint("\u25B6 Playing", 900);
  } else {
    audio.pause();
    showHint("\u23F8 Paused", 900);
  }
}

function resetAudio() {
  audio.pause();
  rewind();
  if (DOUBLE_TAP_RESTARTS) {
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
    showHint("\u21BA Restarted", 1000);
  } else {
    showHint("\u21BA Reset", 1000);
  }
}

/* ---------- Taps and long press ---------- */
// Tap = play / pause (and a sparkle flash). Double-tap = reset the music. Long press = reverse the balloons.
// A tap is detected on release because phones only allow audio to start from a release (not a press).

let down = null;            // the press in progress
let pressTimer = null;
let longFired = false;
let lastTap = -99;

function setBalloonDirection(dir) {
  dirTarget = dir;
  showHint(dir > 0 ? "Balloons drifting up" : "Balloons drifting down", 1200);
}

stage.addEventListener("contextmenu", e => e.preventDefault());   // no long-press menu on phones

stage.addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest(".ui button")) { down = null; return; }
  down = { x: e.clientX, y: e.clientY, id: e.pointerId };
  longFired = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    if (!down) return;
    longFired = true;
    if (LONG_PRESS_MODE === "hold") setBalloonDirection(-1);
    else setBalloonDirection(-dirTarget);
    if (navigator.vibrate) navigator.vibrate(20);
  }, LONG_PRESS_TIME * 1000);
});

stage.addEventListener("pointermove", e => {                        // moving far enough turns the press into a drag, not a tap
  if (down && down.id === e.pointerId && Math.hypot(e.clientX - down.x, e.clientY - down.y) > TAP_MAX_MOVE) {
    down.dragged = true;
    clearTimeout(pressTimer);
  }
});

stage.addEventListener("pointercancel", () => { down = null; clearTimeout(pressTimer); });

stage.addEventListener("pointerup", e => {
  clearTimeout(pressTimer);
  if (!down || down.id !== e.pointerId) return;
  const wasDragged = !!down.dragged;
  down = null;

  if (longFired) {                                                   // a long press is not also a tap
    longFired = false;
    if (LONG_PRESS_MODE === "hold") setBalloonDirection(1);
    return;
  }
  if (wasDragged) return;

  const now = performance.now() / 1000;
  if (now - lastTap < DOUBLE_TAP_TIME) {
    // double-tap: reset the music (the first tap of the pair already toggled it; this undoes that)
    lastTap = -99;
    resetAudio();
    if (DOUBLE_TAP_RECENTERS) base = null;
    return;
  }
  lastTap = now;
  togglePlay();
  if (!reduceMotion) pulseStart = now;                               // sparkle flash on each tap
});

const needsPermission =
  typeof DeviceOrientationEvent !== "undefined" &&
  typeof DeviceOrientationEvent.requestPermission === "function";

const isTouch = matchMedia("(pointer: coarse)").matches;

if (needsPermission) {
  enableBtn.classList.remove("hidden");
  enableBtn.addEventListener("click", async () => {
    try {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result === "granted") {
        startTilt();
      } else {
        enableBtn.classList.add("hidden");
        showHint("Motion access was denied. Reload the page to try again.", 5000);
      }
    } catch (err) {
      showHint("Couldn't enable tilt on this page.", 4000);
    }
  });
} else if (isTouch && "DeviceOrientationEvent" in window) {
  startTilt();
} else {
  showHint("Move your mouse over the image. Click for music, double-click to reset. Hold to reverse the balloons.", 5000);
}
</script>
</body>
</html>
